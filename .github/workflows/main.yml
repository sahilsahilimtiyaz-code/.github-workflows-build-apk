name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK and required components
        shell: bash
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euxo pipefail
          sudo mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          sudo chmod -R 777 "$ANDROID_SDK_ROOT"

          curl -fsSL -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          if [ -d "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" ]; then
            sudo rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
            sudo mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          fi

          set +o pipefail
          yes 2>/dev/null | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" \
            --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          set -o pipefail

      - name: Locate Gradle project
        id: gradle_project
        shell: bash
        run: |
          set -euo pipefail

          candidate="$(find . -type f -name 'gradlew' | sort | head -n 1 || true)"
          if [ -z "$candidate" ]; then
            candidate="$(find . -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) | sort | head -n 1 || true)"
          fi

          if [ -z "$candidate" ]; then
            echo "No Gradle/Android project files were found in the repository."
            echo "Please check out the Android project or add the app sources before running the build."
            exit 1
          fi

          project_dir="$(dirname "$candidate")"
          echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "Found Gradle project at: $project_dir"
          ls -la "$project_dir"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Build APK
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail

          project_dir="${{ steps.gradle_project.outputs.project_dir }}"

          if [ -x "$project_dir/gradlew" ]; then
            chmod +x "$project_dir/gradlew"
            "$project_dir/gradlew" :app:assembleDebug --no-daemon --stacktrace --info
          else
            if [ ! -f ./gradlew ]; then
              echo "No gradlew wrapper found at repository root or project directory: $project_dir"
              exit 1
            fi
            chmod +x ./gradlew
            ./gradlew -p "$project_dir" :app:assembleDebug --no-daemon --stacktrace --info
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OctaKeyclick-debug-apk
          path: ${{ steps.gradle_project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
